<!doctype html>
<html>
  <head>
    <link rel="stylesheet" href="style.css">
    <title>Reminder App</title>
  </head>
  <body>
    <div class="app-container"> 
      
      <!-- ЛЕВАЯ ПАНЕЛЬ -->
      <div class="sidebar-panel"> 
        <button class="add-btn">+ Новое напоминание</button>
        
        <div class="sidebar-section-header">
          <span>ОБЗОР</span>
          <button id="theme-toggle" class="theme-toggle-btn">🌙</button>
        </div>
        
        <div class="menu">
          <button class="menu-item active">📅 Календарь</button>
          <button class="menu-item">☀️ Сегодня</button>
          <button class="menu-item">🔔 Все напоминания</button>
          <button class="menu-item">✅ Выполненные</button>
        </div>

        <div class="sidebar-section-header">
          <span>СЕГОДНЯ</span>
          <span class="events-count" id="today-count">0 событий</span>
        </div>

        <div class="today-reminders" id="today-list"></div>
      </div>

      <!-- ЦЕНТРАЛЬНАЯ ПАНЕЛЬ -->
      <main class="calendar-section">
        <div class="calendar-header">
          <button class="nav-btn" id="prev-month">◀</button> 
          <h2 id="calendar-title"></h2>
          <button class="nav-btn" id="next-month">▶</button> 
        </div>
        <div class="weekdays">
          <div>ПН</div><div>ВТ</div><div>СР</div><div>ЧТ</div><div>ПТ</div><div>СБ</div><div>ВС</div>
        </div>
        <div id="calendar-grid" class="calendar-grid"></div>
      </main>

      <!-- ПРАВАЯ ПАНЕЛЬ -->
      <div class="form-panel">
        <div class="form-panel-header">
          <h3>Напоминание</h3>
          <span class="save-status">Изменения ещё не сохранены</span>
        </div>

        <div class="date-badge">
          <div class="date-badge-info">
            <span class="badge-month-day" id="badge-date-num">12</span>
            <div class="badge-text">
              <span class="badge-day-name" id="badge-day-name">Понедельник</span>
              <span class="badge-full-date" id="badge-full-date">12 октября 2026</span>
            </div>
          </div>
          <span class="calendar-icon">📅</span>
        </div>

        <div class="form-group">
          <label>Название</label>
          <input type="text" id="task-title" placeholder="Забрать заказ">
        </div>
        
        <div class="form-group">
          <label>Время</label>
          <input type="text" id="task-time" placeholder="19:00">
        </div>

        <div class="form-group">
          <label>Описание</label>
          <textarea id="task-desc" placeholder="Пункт выдачи..."></textarea>
          <div class="char-counter"><span id="char-count">0</span> / 280</div>
        </div>

        <div class="form-group">
          <label>Категория</label>
          <div class="category-tags">
            <button class="tag-btn personal active">🟢 Личное</button>
            <button class="tag-btn work">🔵 Работа</button>
            <button class="tag-btn important">🔴 Важное</button>
          </div>
        </div>

        <div class="extra-settings">
          <div class="setting-item">
            <div class="setting-icon">🔔</div>
            <div class="setting-text">
              <div class="setting-title">Уведомить заранее</div>
              <div class="setting-desc">За 15 минут</div>
            </div>
            <select class="setting-select" id="task-reminder-time">
              <option value="none">Нет</option>
              <option value="15">15 мин</option>
              <option value="30">30 мин</option>
              <option value="60">1 час</option>
            </select>
          </div>
          <div class="setting-item">
            <div class="setting-icon">🔄</div>
            <div class="setting-text">
              <div class="setting-title">Повторять</div>
              <div class="setting-desc">Не повторять</div>
            </div>
            <label class="toggle-switch">
              <input type="checkbox">
              <span class="slider"></span>
            </label>
          </div>
        </div>

        <button class="save-btn" id="save-task-btn">Сохранить</button>
      </div>

    </div>
    <script src="script.js"></script>
  </body>
</html>
